<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#005fb8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>avd-learn — AZ-104 &amp; AZ-140</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/app-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <h1>avd-learn</h1>
        <span class="subtitle">AZ-104 &amp; AZ-140</span>
      </div>
      <div class="filters">
        <select id="exam-filter" aria-label="Filter by exam">
          <option value="all">All Exams</option>
          <option value="AZ-104">AZ-104</option>
          <option value="AZ-140">AZ-140</option>
        </select>
        <select id="track-filter" aria-label="Filter by track">
          <option value="all">All Tracks</option>
        </select>
        <button id="install-app" type="button" class="primary" hidden>Install</button>
      </div>
    </div>
  </header>

  <main class="container">
    <p id="install-status" class="meta" role="status"></p>

    <div class="tabs">
      <div role="tablist" aria-label="Study modes" class="tablist">
        <button type="button" role="tab" id="tab-overview" aria-selected="true" tabindex="0">Overview</button>
        <button type="button" role="tab" id="tab-study" aria-selected="false" tabindex="-1">Study</button>
        <button type="button" role="tab" id="tab-flashcards" aria-selected="false" tabindex="-1">Flashcards</button>
        <button type="button" role="tab" id="tab-exam" aria-selected="false" tabindex="-1">Exam</button>
        <button type="button" role="tab" id="tab-labs" aria-selected="false" tabindex="-1">Labs</button>
        <button type="button" role="tab" id="tab-diagnose" aria-selected="false" tabindex="-1">Diagnose</button>
      </div>

      <section role="tabpanel" id="panel-overview" aria-labelledby="tab-overview">
        <div class="panel-body" id="overview-content">Loading…</div>
      </section>

      <section role="tabpanel" id="panel-study" aria-labelledby="tab-study" hidden>
        <div class="panel-body" id="study-content">Loading…</div>
      </section>

      <section role="tabpanel" id="panel-flashcards" aria-labelledby="tab-flashcards" hidden>
        <div class="panel-body" id="flashcards-content">Loading…</div>
      </section>

      <section role="tabpanel" id="panel-exam" aria-labelledby="tab-exam" hidden>
        <div class="panel-body" id="exam-content">Loading…</div>
      </section>

      <section role="tabpanel" id="panel-labs" aria-labelledby="tab-labs" hidden>
        <div class="panel-body" id="labs-content">Loading…</div>
      </section>

      <section role="tabpanel" id="panel-diagnose" aria-labelledby="tab-diagnose" hidden>
        <div class="panel-body" id="diagnose-content">Loading…</div>
      </section>
    </div>

    <footer class="site-footer">
      Personal study project, not affiliated with Microsoft. Zero tenant data.
      <a href="https://github.com/avd-ops/avd-learn" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
